<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>FireFly</title> <style> @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@500;600;700&display=swap'); :root { --font-display: 'Syne', system-ui, sans-serif; --font-body: 'DM Mono', 'Courier New', monospace; --r: 6px; --r-lg: 10px; --bg-solid: #110f0d; --bg-hover: rgba(30, 24, 20, 0.40); --border: rgba(255, 140, 60, 0.10); --border-strong: rgba(255, 140, 60, 0.22); --border-hi: rgba(255, 140, 60, 0.50); --accent: #f06c28; --accent-2: #d94040; --accent-dim: rgba(240, 108, 40, 0.15); --accent-grad: linear-gradient(100deg, #f07028 0%, #e04840 100%); --text-hi: #f2ebe3; --text-mid: rgba(242, 235, 227, 0.52); --text-low: rgba(242, 235, 227, 0.28); --shadow: 0 2px 12px rgba(0, 0, 0, 0.6); --dur: 160ms; --ease: cubic-bezier(0.4, 0, 0.2, 1); } * { box-sizing: border-box; } html, body { min-height: 100%; } body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0b0908; color: var(--text-hi); font-family: var(--font-body); font-size: 13px; -webkit-font-smoothing: antialiased; } .launcher { width: 850px; max-width: 90%; padding: 30px; background: var(--bg-solid); border: 1px solid var(--border-strong); border-radius: var(--r-lg); box-shadow: var(--shadow); text-align: center; } .logo { display: block; width: 86px; height: 86px; object-fit: contain; margin: 0 auto 18px; filter: drop-shadow(0 0 10px rgba(240, 108, 40, 0.18)) drop-shadow(0 0 25px rgba(217, 64, 64, 0.08)); } .title { padding-bottom: 22px; margin-bottom: 20px; border-bottom: 1px solid var(--border); } .title h1 { margin: 0; font-family: var(--font-display); font-size: 32px; font-weight: 700; letter-spacing: -0.02em; } .title p { margin: 7px 0 0; color: var(--text-mid); font-size: 0.82rem; } .games { display: grid; grid-template-columns: 1fr; } .game { padding: 18px; background: transparent; border: 1px solid var(--border); border-radius: var(--r); transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease); } .game { padding: 18px; background: transparent; border: 1px solid var(--border); border-radius: var(--r); text-align: center; transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease); } .game h2 { margin: 0 0 14px; font-family: var(--font-display); font-size: 0.95rem; font-weight: 600; } .launch { width: 100%; padding: 10px 14px; border: 0; border-radius: var(--r); background: var(--accent-grad); color: #fff; font-family: var(--font-body); font-size: 0.78rem; font-weight: 500; cursor: pointer; transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease); } .launch:hover { opacity: 0.88; } .launch:active { transform: scale(0.985); } .status { min-height: 18px; margin-top: 16px; color: var(--text-low); font-size: 0.72rem; } .loading { opacity: 0.5; pointer-events: none; } @media (max-width: 520px) { .launcher { padding: 22px; } .logo { width: 70px; height: 70px; } .title h1 { font-size: 27px; } } </style> </head> <body> <div class="launcher"> <img class="logo" src="https://cdn.jsdelivr.net/gh/X-NOBER/FireFLy_V0.5a@main/logo/FireFly%20Logo.png" alt="FireFly Logo" > <div class="title"> <h1>FireFly</h1> <p>Launch FireFly.</p> </div> <div id="games" class="games"></div> <div id="status" class="status"></div> </div> <script> const GAME = { name: "FireFly", url: "https://cdn.jsdelivr.net/gh/X-NOBER/FireFLy_V0.5a@main/index.html", base: "https://cdn.jsdelivr.net/gh/X-NOBER/FireFLy_V0.5a@main/" }; const gamesContainer = document.getElementById("games"); const status = document.getElementById("status"); const card = document.createElement("div"); card.className = "game"; card.innerHTML = ` <h2>${GAME.name}</h2> <button class="launch">Launch</button> `; const button = card.querySelector(".launch"); button.addEventListener("click", () => { launchGame(GAME, button); }); gamesContainer.appendChild(card); async function launchGame(game, button) { button.classList.add("loading"); button.textContent = "Loading..."; status.textContent = `Fetching ${game.name}...`; try { const response = await fetch(game.url); if (!response.ok) { throw new Error( `HTTP ${response.status} ${response.statusText}` ); } let html = await response.text(); status.textContent = `Opening ${game.name}...`; const baseTag = `<base href="${game.base}" target="_blank">`; if (/<head[^>]*>/i.test(html)) { html = html.replace( /<head[^>]*>/i, match => `${match}\n${baseTag}` ); } else { html = `${baseTag}\n${html}`; } const newTab = window.open("about:blank", "_blank"); if (!newTab) { throw new Error( "The browser blocked the new tab. Allow popups for this site." ); } newTab.document.open(); newTab.document.write(html); newTab.document.close(); try { newTab.document.title = game.name; } catch {} status.textContent = `${game.name} launched.`; } catch (error) { console.error(error); status.textContent = `Failed to launch ${game.name}: ${error.message}`; } finally { button.classList.remove("loading"); button.textContent = "Launch"; } } </script> </body> </html>
